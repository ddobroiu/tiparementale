# Rulare pe server: `docker compose up -d --build`
#
# Portul 3007 al gazdei → 3000 în container. Secretele vin din `.env` (fișier
# pe server, niciodată în depozit); baza de date e cea partajată, deja
# existentă, cu rolul limitat la schema proiectului.

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://tiparementale.ro}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://tiparementale.ro}
    container_name: tiparementale
    restart: unless-stopped
    ports:
      - "3007:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/intra"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
